<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Advanced GPA Calculator</title>

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js" defer></script>

</head>
<body>

<div class="container mt-5">
<h2 class="text-primary">GPA Calculator</h2>

<div id="result"></div>

<form id="gpaForm">

<div class="form-group">
<label>Student Name</label>
<input type="text" name="student" class="form-control" required>
</div>

<div class="form-group">
<label>Semester</label>
<input type="text" name="semester" class="form-control" required>
</div>

<div id="courses">

<div class="form-row course-row mb-2">
<div class="col">
<input type="text" name="course[]" class="form-control" placeholder="Course Name" required>
</div>
<div class="col-2">
<input type="number" name="credits[]" class="form-control" min="1" placeholder="Credits" required>
</div>
<div class="col-2">
<select name="grade[]" class="form-control">
<option value="4.0">A</option>
<option value="3.0">B</option>
<option value="2.0">C</option>
<option value="1.0">D</option>
<option value="0.0">F</option>
</select>
</div>
</div>

</div>

<button type="button" id="addCourse" class="btn btn-secondary mb-3">
+ Add Course
</button>

<button type="submit" class="btn btn-primary">
Calculate GPA
</button>

<a href="export.php" class="btn btn-success">Download CSV</a>

</form>

</div>

</body>
</html>
